---
# Despliegue por cPanel Git Version Control.
#
# IMPORTANTE: este archivo está versionado, así que TODAS las instancias
# reciben exactamente el mismo. Nunca incluir rutas absolutas al directorio del
# usuario: la tarea se ejecutaría sobre la instancia equivocada. Las tareas
# corren con el directorio de trabajo en la raíz del clone de cada instancia.
#
# Las migraciones NO se ejecutan aquí: son un paso manual y explícito.
# Ver docs/DESPLIEGUE_INSTANCIAS.md.
deployment:
  tasks:
    - php artisan config:cache
    - php artisan route:cache
    - php artisan view:cache
